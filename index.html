<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Ruta 57 Box</title>
  <style>
    :root {
      --primary: #0052cc;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #172b4d;
      --accent: #de350b;
      --success: #00875a;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .auth-container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
    .card { background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: var(--primary); text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
    input { width: 100%; padding: 10px; border: 1px solid #dfe1e6; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,82,204,0.2); }
    .btn { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; margin-top: 10px; }
    .btn:hover { opacity: 0.9; }
    .hidden { display: none; }
    .toggle-text { text-align: center; margin-top: 15px; font-size: 0.9rem; color: #5e6c84; cursor: pointer; }
    .toggle-text span { color: var(--primary); font-weight: bold; }

    /* ESTILOS PARA MODAL PROFESIONAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 30, 66, 0.54); display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #fff; width: 100%; max-width: 380px; padding: 24px;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(9, 30, 66, 0.25);
      text-align: center; transform: translateY(-10px); transition: transform 0.2s ease;
    }
    .modal-overlay.active .modal-box { transform: translateY(0); }
    .modal-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 10px; color: var(--text); }
    .modal-text { font-size: 0.95rem; color: #5e6c84; margin-bottom: 20px; line-height: 1.4; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- MODAL / POPUP PERSONALIZADO -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">Aviso</div>
      <div class="modal-text" id="modalText">Mensaje del sistema.</div>
      <div class="modal-actions" id="modalActions">
        <button class="btn" style="margin-top:0;" onclick="cerrarModal()">Aceptar</button>
      </div>
    </div>
  </div>

  <div class="auth-container">
    
    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <div class="card" id="loginCard">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm" onsubmit="iniciarSesion(event)">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Entrar</button>
      </form>
      <div class="toggle-text" onclick="alternarFormularios()">
        ¿No tienes cuenta? <span>Regístrate aquí</span>
      </div>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <div class="card hidden" id="registerCard">
      <h2>Crear Cuenta</h2>
      <form id="registerForm" onsubmit="registrarUsuario(event)">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="regNombre" required placeholder="Gary Ortega">
        </div>
        <div class="form-group">
          <label>Cédula de Identidad</label>
          <input type="text" id="regCedula" required placeholder="V-12345678">
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="regEmail" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Registrarse</button>
      </form>
      <div class="toggle-text" onclick="alternarFormularios()">
        ¿Ya tienes cuenta? <span>Inicia sesión</span>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://kaagiibjvcxrhxsgmusj.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYWdpaWJqdmN4cmh4c2dtdXNqIiwicm9sZSI6ImFub24iOiJhdXRoIiwiYXVkIjoiYW5vbiIsImlhdCI6MTc4ODQ1MDUyOCwiZXhwIjoyMTA0MDI2NTI4f0.mAI7kMDkkMjeBMe45_sKyKUEX2v1yBoAi4jcjsETjpc'
    
    const { createClient } = window.supabase
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // FUNCIONES DE MODAL PROFESIONAL
    function mostrarModal(titulo, texto, callback = null) {
      document.getElementById('modalTitle').innerText = titulo;
      document.getElementById('modalText').innerText = texto;
      const actionsDiv = document.getElementById('modalActions');
      
      actionsDiv.innerHTML = `<button class="btn" style="margin-top:0;" id="btnModalOk">Aceptar</button>`;
      
      document.getElementById('customModal').classList.add('active');
      
      document.getElementById('btnModalOk').onclick = () => {
        cerrarModal();
        if (callback) callback();
      };
    }

    function cerrarModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    // ALTERNAR ENTRE VISTAS DE LOGIN Y REGISTRO
    function alternarFormularios() {
      const loginCard = document.getElementById('loginCard');
      const registerCard = document.getElementById('registerCard');
      loginCard.classList.toggle('hidden');
      registerCard.classList.toggle('hidden');
    }

    // PROCESO DE INICIO DE SESIÓN
    async function iniciarSesion(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        mostrarModal("Error de acceso", error.message);
      } else {
        window.location.href = 'panel.html';
      }
    }

    // PROCESO DE REGISTRO
    async function registrarUsuario(event) {
      event.preventDefault();
      const nombre = document.getElementById('regNombre').value;
      const cedula = document.getElementById('regCedula').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      // 1. Crear el usuario en Auth de Supabase
      const { data: authData, error: authError } = await _supabase.auth.signUp({
        email: email,
        password: password,
      });

      if (authError) {
        mostrarModal("Error en el registro", authError.message);
        return;
      }

      if (authData.user) {
        // 2. Generar un código de casillero aleatorio
        const numeroAleatorio = Math.floor(1000 + Math.random() * 9000);
        const codigoCasillero = `R57-${numeroAleatorio}`;

        // 3. Guardar los datos complementarios en la tabla 'perfiles'
        const { error: perfilError } = await _supabase.from('perfiles').insert([
          {
            id: authData.user.id,
            nombre_completo: nombre,
            cedula: cedula,
            codigo_casillero: codigoCasillero,
            rol: 'cliente'
          }
        ]);

        if (perfilError) {
          mostrarModal("Advertencia", "Tu cuenta fue creada, pero hubo un error al asignar el casillero: " + perfilError.message);
        } else {
          mostrarModal(
            "¡Registro exitoso!", 
            `Tu cuenta ha sido creada correctamente. Tu código de casillero asignado es: ${codigoCasillero}`, 
            () => {
              window.location.href = 'panel.html';
            }
          );
        }
      }
    }
  </script>
</body>
</html>
