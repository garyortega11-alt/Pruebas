<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Ruta 57 Box</title>
  <style>
    :root {
      --primary: #004581;
      --primary-hover: #003360;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --accent: #e11d48;
      --success: #16a34a;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .auth-container { width: 100%; max-width: 440px; padding: 20px; box-sizing: border-box; }
    .card { background: var(--card); padding: 36px 30px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    h2 { margin-top: 0; color: var(--primary); text-align: center; margin-bottom: 28px; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.025em; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; color: #334155; }
    input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 1rem; color: var(--text); background-color: #fff; transition: all 0.2s; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,69,129,0.15); }
    .btn { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background 0.2s; margin-top: 12px; box-shadow: 0 4px 6px -1px rgba(0,69,129,0.2); }
    .btn:hover { background: var(--primary-hover); }
    .hidden { display: none; }
    .toggle-text { text-align: center; margin-top: 22px; font-size: 0.9rem; color: var(--muted); cursor: pointer; }
    .toggle-text span { color: var(--primary); font-weight: 600; text-decoration: underline; }

    /* ESTILOS PARA MODAL PROFESIONAL TIPO ZOOM */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #fff; width: 100%; max-width: 420px; padding: 30px;
      border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center; transform: scale(0.95); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-icon { width: 50px; height: 50px; border-radius: 50%; background: #eff6ff; color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 1.5rem; font-weight: bold; }
    .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; color: var(--text); }
    .modal-text { font-size: 0.95rem; color: var(--muted); margin-bottom: 24px; line-height: 1.5; word-break: break-word; }
    .modal-actions { display: flex; gap: 12px; justify-content: center; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- MODAL / POPUP ESTILO ZOOM -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon">i</div>
      <div class="modal-title" id="modalTitle">Aviso</div>
      <div class="modal-text" id="modalText">Mensaje del sistema.</div>
      <div class="modal-actions" id="modalActions">
        <button class="btn" style="margin-top:0;" onclick="cerrarModal()">Aceptar</button>
      </div>
    </div>
  </div>

  <div class="auth-container">
    
    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <div class="card" id="loginCard">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm" onsubmit="iniciarSesion(event)">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Entrar</button>
      </form>
      <div class="toggle-text" onclick="alternarFormularios()">
        ¿No tienes cuenta? <span>Regístrate aquí</span>
      </div>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <div class="card hidden" id="registerCard">
      <h2>Crear Cuenta</h2>
      <form id="registerForm" onsubmit="registrarUsuario(event)">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="regNombre" required placeholder="Gary Ortega">
        </div>
        <div class="form-group">
          <label>Cédula de Identidad</label>
          <input type="text" id="regCedula" required placeholder="V-12345678">
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="regEmail" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Registrarse</button>
      </form>
      <div class="toggle-text" onclick="alternarFormularios()">
        ¿Ya tienes cuenta? <span>Inicia sesión</span>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://kaagiibjvcxrhxsgmusj.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYWdpaWJqdmN4cmh4c2dtdXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTA1MjgsImV4cCI6MjEwNDAyNjUyOH0.mAI7kMDkkMjeBMe45_sKyKUEX2v1yBoAi4jcjsETjpc'
    
    const { createClient } = window.supabase
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // FUNCIONES DE MODAL ESTILO ZOOM
    function mostrarModal(titulo, texto, callback = null) {
      document.getElementById('modalTitle').innerText = titulo;
      document.getElementById('modalText').innerText = texto;
      const actionsDiv = document.getElementById('modalActions');
      
      actionsDiv.innerHTML = `<button class="btn" style="margin-top:0;" id="btnModalOk">Aceptar</button>`;
      
      document.getElementById('customModal').classList.add('active');
      
      document.getElementById('btnModalOk').onclick = () => {
        cerrarModal();
        if (callback) callback();
      };
    }

    function cerrarModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    // ALTERNAR ENTRE VISTAS DE LOGIN Y REGISTRO
    function alternarFormularios() {
      const loginCard = document.getElementById('loginCard');
      const registerCard = document.getElementById('registerCard');
      loginCard.classList.toggle('hidden');
      registerCard.classList.toggle('hidden');
    }

    // PROCESO DE INICIO DE SESIÓN
    async function iniciarSesion(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        mostrarModal("Error de acceso", error.message);
      } else {
        window.location.href = 'panel.html';
      }
    }

    // PROCESO DE REGISTRO
    async function registrarUsuario(event) {
      event.preventDefault();
      const nombre = document.getElementById('regNombre').value;
      const cedula = document.getElementById('regCedula').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      const { data: authData, error: authError } = await _supabase.auth.signUp({
        email: email,
        password: password,
      });

      if (authError) {
        mostrarModal("Error en el registro", authError.message);
        return;
      }

      if (authData.user) {
        const numeroAleatorio = Math.floor(1000 + Math.random() * 9000);
        const codigoCasillero = `R57-${numeroAleatorio}`;

        const { error: perfilError } = await _supabase.from('perfiles').insert([
          {
            id: authData.user.id,
            nombre_completo: nombre,
            cedula: cedula,
            codigo_casillero: codigoCasillero,
            rol: 'cliente'
          }
        ]);

        if (perfilError) {
          mostrarModal("Advertencia", "Tu cuenta fue creada, pero hubo un error al asignar el casillero: " + perfilError.message);
        } else {
          mostrarModal(
            "¡Registro exitoso!", 
            `Tu cuenta ha sido creada correctamente. Tu código de casillero asignado es: ${codigoCasillero}`, 
            () => {
              window.location.href = 'panel.html';
            }
          );
        }
      }
    }
  </script>
</body>
</html>
