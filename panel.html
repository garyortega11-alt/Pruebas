<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Casillero | Ruta 57 Box</title>
  <style>
    :root {
      --primary: #0052cc;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #172b4d;
      --accent: #de350b;
      --success: #00875a;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-actions { display: flex; gap: 10px; }
    .card { background: var(--card); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #6b778c; }
    .btn-danger { background: var(--accent); }
    .btn-success { background: var(--success); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { border: 1px solid #dfe1e6; padding: 10px; text-align: left; }
    th { background: #fafbfc; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { margin-bottom: 12px; }
    .form-group.full { grid-column: span 2; }
    label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.85rem; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .hidden { display: none; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: white; }
    .badge-pre { background: #ffab00; }
    .badge-bodega { background: #0052cc; }
    .badge-transito { background: #00b8d9; }
    .badge-entregado { background: var(--success); }

    /* ESTILOS PARA MODAL PROFESIONAL */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 30, 66, 0.54); display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #fff; width: 100%; max-width: 380px; padding: 24px;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(9, 30, 66, 0.25);
      text-align: center; transform: translateY(-10px); transition: transform 0.2s ease;
    }
    .modal-overlay.active .modal-box { transform: translateY(0); }
    .modal-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 10px; color: var(--text); }
    .modal-text { font-size: 0.95rem; color: #5e6c84; margin-bottom: 20px; line-height: 1.4; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- MODAL / POPUP PERSONALIZADO -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">Aviso</div>
      <div class="modal-text" id="modalText">Mensaje del sistema.</div>
      <div class="modal-actions" id="modalActions">
        <button class="btn" style="margin-top:0;" onclick="cerrarModal()">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- PANTALLA DE CARGA INICIAL -->
  <div id="loadingState" style="text-align: center; margin-top: 50px;">
    <h2>Cargando tu casillero...</h2>
  </div>

  <!-- CONTENIDO DEL CASILLERO -->
  <div class="container hidden" id="panelContent">
    <div class="header">
      <div>
        <h2>📦 Mi Casillero: <span id="lblCasillero" style="color: var(--primary);">---</span></h2>
        <p style="margin: 0; color: #5e6c84;" id="lblNombre">Cargando perfil...</p>
      </div>
      <div class="header-actions">
        <a href="admin.html" class="btn btn-secondary hidden" id="btnAdminLink">Panel Admin</a>
        <button class="btn btn-danger" id="btnLogout">Cerrar Sesión</button>
      </div>
    </div>

    <!-- FORMULARIO DE PRE-ALERTA -->
    <div class="card">
      <h3>Pre-alertar Nuevo Paquete</h3>
      <form id="formPrealerta" onsubmit="prealertarPaquete(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Guía de la Transportadora</label>
            <input type="text" id="guia" required placeholder="Ej: 1Z99999999999999">
          </div>
          <div class="form-group">
            <label>Transportadora (Courier en USA)</label>
            <input type="text" id="transportadora" placeholder="Ej: Amazon, FedEx, UPS">
          </div>
          <div class="form-group full">
            <label>Contenido del Paquete</label>
            <textarea id="contenido" rows="2" required placeholder="Ej: 2 Zapatos deportivos, 1 Camisa"></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-success">Registrar Pre-alerta</button>
      </form>
    </div>

    <!-- LISTA DE PAQUETES DEL CLIENTE -->
    <div class="card">
      <h3>Mis Paquetes y Pre-alertas</h3>
      <table>
        <thead>
          <tr>
            <th>Guía</th>
            <th>Transportadora</th>
            <th>Contenido</th>
            <th>Peso</th>
            <th>Flete</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tablaMisPaquetes">
          <tr><td colspan="6" style="text-align:center;">Cargando tus paquetes...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kaagiibjvcxrhxsgmusj.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYWdpaWJqdmN4cmh4c2dtdXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTA1MjgsImV4cCI6MjEwNDAyNjUyOH0.mAI7kMDkkMjeBMe45_sKyKUEX2v1yBoAi4jcjsETjpc'
    
    const { createClient } = window.supabase
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    let usuarioActual = null;

    // FUNCIONES DE MODAL PROFESIONAL
    function mostrarModal(titulo, texto, callback = null) {
      document.getElementById('modalTitle').innerText = titulo;
      document.getElementById('modalText').innerText = texto;
      const actionsDiv = document.getElementById('modalActions');
      
      actionsDiv.innerHTML = `<button class="btn" style="margin-top:0;" id="btnModalOk">Aceptar</button>`;
      
      document.getElementById('customModal').classList.add('active');
      
      document.getElementById('btnModalOk').onclick = () => {
        cerrarModal();
        if (callback) callback();
      };
    }

    function cerrarModal() {
      document.getElementById('customModal').classList.remove('active');
    }

    // VERIFICAR SESIÓN Y CARGAR DATOS
    async function inicializarPanel() {
      try {
        const { data: { session }, error: sessionError } = await _supabase.auth.getSession();
        if (sessionError || !session) {
          window.location.href = "index.html";
          return;
        }

        usuarioActual = session.user;

        // Obtener perfil del usuario
        const { data: perfil, error: perfilError } = await _supabase
          .from('perfiles')
          .select('*')
          .eq('id', usuarioActual.id)
          .maybeSingle();

        if (perfilError || !perfil) {
          mostrarModal("Error", "No se encontró el perfil de usuario.");
          return;
        }

        document.getElementById('lblCasillero').innerText = perfil.codigo_casillero || 'S/N';
        document.getElementById('lblNombre').innerText = `${perfil.nombre_completo} — Cédula: ${perfil.cedula || 'N/A'}`;

        // Si es admin, mostrar enlace al panel de administración
        if (perfil.rol === 'admin') {
          document.getElementById('btnAdminLink').classList.remove('hidden');
        }

        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('panelContent').classList.remove('hidden');

        cargarMisPaquetes();
      } catch (err) {
        console.error("Error al inicializar:", err);
        window.location.href = "index.html";
      }
    }

    // CARGAR PAQUETES DEL CLIENTE
    async function cargarMisPaquetes() {
      const tbody = document.getElementById('tablaMisPaquetes');
      
      const { data: paquetes, error } = await _supabase
        .from('paquetes')
        .select('*')
        .eq('user_id', usuarioActual.id)
        .order('id', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">Error al cargar: ${error.message}</td></tr>`;
        return;
      }

      if (!paquetes || paquetes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#666;">No tienes paquetes ni pre-alertas registradas.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      paquetes.forEach(p => {
        let badgeClass = 'badge-pre';
        if (p.estado === 'Recibido en Bodega') badgeClass = 'badge-bodega';
        else if (p.estado === 'En Tránsito') badgeClass = 'badge-transito';
        else if (p.estado === 'Entregado') badgeClass = 'badge-entregado';

        tbody.innerHTML += `
          <tr>
            <td><strong>${p.guia_transportadora || 'Sin guía'}</strong></td>
            <td>${p.transportadora || 'N/A'}</td>
            <td>${p.contenido || 'Sin descripción'}</td>
            <td>${p.peso_kg ? p.peso_kg + ' Kg' : 'Por calcular'}</td>
            <td>${p.monto_flete ? '$' + p.monto_flete : 'Por calcular'}</td>
            <td><span class="badge ${badgeClass}">${p.estado || 'Pre-alertado'}</span></td>
          </tr>
        `;
      });
    }

    // PRE-ALERTAR PAQUETE
    async function prealertarPaquete(event) {
      event.preventDefault();
      
      const guia = document.getElementById('guia').value;
      const transportadora = document.getElementById('transportadora').value;
      const contenido = document.getElementById('contenido').value;

      const { error } = await _supabase.from('paquetes').insert([
        {
          user_id: usuarioActual.id,
          guia_transportadora: guia,
          transportadora: transportadora,
          contenido: contenido,
          estado: 'Pre-alertado'
        }
      ]);

      if (error) {
        mostrarModal("Error", "No se pudo registrar la pre-alerta: " + error.message);
      } else {
        mostrarModal("¡Éxito!", "Tu pre-alerta ha sido registrada correctamente.", () => {
          document.getElementById('formPrealerta').reset();
          cargarMisPaquetes();
        });
      }
    }

    // CERRAR SESIÓN
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await _supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    inicializarPanel();
  </script>
</body>
</html>
